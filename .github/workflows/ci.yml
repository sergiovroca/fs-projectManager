name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Laboratorio 2 (Sesión 7): disparador manual para desplegar a producción.
  # Se usa desde Actions → CI → "Run workflow".
  workflow_dispatch:
    inputs:
      confirmacion:
        description: 'Escribe DEPLOY para confirmar el despliegue a produccion'
        required: true

jobs:
  frontend:
    name: Frontend - Lint & Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
          cache-dependency-path: pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile
      - run: pnpm run lint
      - run: pnpm run build

  backend:
    name: Backend - Typecheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
          cache-dependency-path: backend/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm run build

  # Laboratorio 1 (Sesión 6): las variables sensibles llegan desde GitHub Secrets.
  # Sus valores NUNCA se escriben en este archivo, y GitHub los enmascara (***) en los logs.
  backend-pruebas:
    name: Backend - Pruebas con variables seguras
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      JWT_SECRET: ${{ secrets.JWT_SECRET }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
          cache-dependency-path: backend/pnpm-lock.yaml

      # Falla con un mensaje claro si falta un Secret, sin imprimir nunca su valor
      - name: Verificar que los Secrets existen
        run: |
          for nombre in DATABASE_URL JWT_SECRET; do
            if [ -z "${!nombre}" ]; then
              echo "::error::Falta el Secret $nombre (Settings > Secrets and variables > Actions)"
              exit 1
            fi
            echo "OK: $nombre está configurado"
          done

      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prisma generate
      - run: pnpm run test

  # Laboratorio 2 (Sesión 6): PostgreSQL efímero + migraciones + seed.
  # Esta base solo vive durante esta ejecución, en una máquina descartable de GitHub:
  # por eso sus credenciales pueden ser fijas y de prueba (no son Secrets).
  migraciones:
    name: Migraciones y Seeds
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: testuser
          POSTGRES_PASSWORD: testpass
          POSTGRES_DB: testdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: ./backend
    env:
      DATABASE_URL: postgresql://testuser:testpass@localhost:5432/testdb
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
          cache-dependency-path: backend/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prisma generate
      - run: pnpm exec prisma migrate deploy

      # Se corre dos veces a propósito: un seed reproducible no duplica datos
      - name: Seed (primera corrida)
        run: pnpm exec prisma db seed
      - name: Seed (segunda corrida)
        run: pnpm exec prisma db seed

      - name: Comprobar que el seed no duplicó datos
        run: |
          total=$(psql "$DATABASE_URL" -tAc 'SELECT COUNT(*) FROM "Task";')
          echo "Tareas en la base después de 2 seeds: $total"
          test "$total" -eq 1

  pruebas:
    name: Pruebas unitarias y cobertura
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
          cache-dependency-path: pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile
      - run: pnpm run test:coverage

  e2e:
    name: Pruebas E2E
    runs-on: ubuntu-latest
    # Red de seguridad: si el navegador o el servidor de pruebas se cuelgan,
    # el job falla en 15 minutos en vez de quedarse hasta el limite de 6 horas.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
          cache-dependency-path: pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm exec playwright test

      # Guarda el reporte HTML aunque la prueba falle, para poder revisarlo
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  # Laboratorio 1 (Sesión 7): despliegue continuo a staging.
  # needs: si CUALQUIER check anterior falla, este job no corre (quality gate).
  # if: solo en un push real a main (después de un merge), nunca en un PR abierto.
  deploy-staging:
    name: Deploy a Staging
    needs: [frontend, backend, backend-pruebas, migraciones, pruebas, e2e]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Instalar Railway CLI
        run: npm install -g @railway/cli
      # El Secret RAILWAY_TOKEN es un token de CUENTA (Account Settings → Tokens).
      # El CLI espera ese tipo de token en RAILWAY_API_TOKEN, y como no hay proyecto
      # vinculado en la máquina de GitHub, se indica con --project (el ID no es secreto).
      - name: Desplegar a Railway (staging)
        run: railway up --service backend --environment staging --project abb2203c-98af-4eef-b836-447c8af91205
        env:
          RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_TOKEN }}

  # Laboratorio 2 (Sesión 7): despliegue a producción SOLO manual, escribiendo DEPLOY.
  deploy-produccion:
    name: Deploy a Producción (manual)
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.confirmacion == 'DEPLOY'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: npm install -g @railway/cli
      - name: Desplegar a Railway (produccion)
        run: railway up --service backend --environment production --project abb2203c-98af-4eef-b836-447c8af91205
        env:
          RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
